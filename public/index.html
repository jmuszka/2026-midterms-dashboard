<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midterms 2026 Live</title>
<meta name="description" content="Live US midterm elections dashboard: Senate, House and governor results, maps, seats, streams, news, pundits and prediction markets.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>/* apply the saved theme before the first paint (default: dark) */try{var t=localStorage.getItem('us-dash-theme');if(t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-left">
    <nav class="workspaces" id="workspaces" aria-label="Workspaces"></nav>
    <span class="brand"><h1><span class="flag" aria-hidden="true">🇺🇸</span> Midterms 2026</h1></span>
  </div>
  <div class="bar-center" id="win-title"></div>
  <div class="bar-right">
    <span class="status" id="status">Loading…</span>
    <span class="clock" id="clock"></span>
    <button type="button" id="bar-theme" title="Switch to light mode" aria-label="Switch to light mode" aria-pressed="false">☀</button>
    <button type="button" id="bar-share" title="Copy a link to this exact dashboard" aria-label="Share"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    <button type="button" id="bar-launch" title="New window, open windows (mod+R)">Panels</button>
    <button type="button" id="bar-layouts" title="Load a named layout (replaces the current one)" aria-haspopup="menu" aria-expanded="false">Layouts</button>
    <button type="button" id="bar-help" title="Keybinds and help (mod+/)">?</button>
  </div>
</header>
<div class="transport" id="transport" hidden></div>
<div class="credits sources credits-line" id="credits-sources"></div>
<div class="paused-banner" id="paused-banner" role="alert" hidden></div>
<div class="notice-banner" id="notice-banner" role="status" hidden></div>
<div class="sim-banner" role="status">SIMULATION · invented results replayed at 30× speed for testing · <a href="?">show real data</a></div>

<main id="desktop"></main>
<footer class="credits" id="credits"></footer>

<div class="launcher" id="launcher" hidden>
  <div class="launcher-box" role="dialog" aria-label="Open panel">
    <input id="launcher-input" type="text" placeholder="New window, preset or open window…" autocomplete="off" spellcheck="false">
    <ul id="launcher-list" role="listbox"></ul>
  </div>
</div>
<div class="help" id="help" hidden>
  <div class="help-box" role="dialog" aria-labelledby="help-title">
    <h2 id="help-title">Keybinds</h2>
    <p class="muted">Hyprland's default binds, using <b id="help-mod">Alt</b> as the main modifier. Your compositor keeps Super for itself, so a web page can never receive it.</p>
    <label class="help-mod">Main modifier
      <select id="mod-select"><option value="alt">Alt</option><option value="ctrlalt">Ctrl + Alt</option></select>
    </label>
    <table id="help-table"></table>
    <div id="help-extra"></div>
    <div class="help-actions"><span><button type="button" id="wm-reset">Reset layout</button> <button type="button" id="wm-restore">Restore my layout</button></span><button type="button" id="help-close">Close</button></div>
  </div>
</div>
<div class="popover" id="popover" hidden></div>
<div class="menu" id="layouts-menu" role="menu" aria-label="Layouts" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tooltip" hidden></div>

<div class="reader" id="reader" hidden>
  <div class="reader-backdrop" data-close></div>
  <div class="reader-win" role="dialog" aria-modal="true" aria-labelledby="reader-title" tabindex="-1">
    <div class="reader-bar">
      <div class="reader-src" id="reader-src"></div>
      <div class="reader-actions">
        <div class="seg-toggle" id="reader-mode" hidden>
          <button type="button" data-mode="reader" class="on">Reader</button>
          <button type="button" data-mode="original">Original page</button>
        </div>
        <button type="button" id="reader-prev" title="Previous article (←)">‹</button>
        <button type="button" id="reader-next" title="Next article (→)">›</button>
        <a id="reader-open" target="_blank" rel="noopener" href="#">Open original ↗</a>
        <button type="button" class="x" data-close title="Close (Esc)" aria-label="Close">✕</button>
      </div>
    </div>
    <h2 class="sr-only" id="reader-title">Article</h2>
    <div class="reader-body">
      <div class="reader-msg" id="reader-msg"></div>
      <iframe id="reader-frame" title="Article" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
    </div>
  </div>
</div>

<!-- hatch fills for "leading" (shared by map and chamber SVGs) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch-DEM" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--dem-hatch-bg)"/><rect width="3" height="6" fill="var(--dem)"/></pattern>
    <pattern id="hatch-GOP" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--gop-hatch-bg)"/><rect width="3" height="6" fill="var(--gop)"/></pattern>
    <pattern id="hatch-IND" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--ind-hatch-bg)"/><rect width="3" height="6" fill="var(--ind)"/></pattern>
    <pattern id="hatch-OTH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--panel)"/><rect width="3" height="6" fill="var(--oth)"/></pattern>
  </defs>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script type="module" src="/js/boot.js"></script>
</body>
</html>
